spring.application.name=reservations-service
server.port=8002

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_reservations}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Instancias de courts-service (se reemplaza por Eureka mas adelante).
# Para probar el balanceo: levantar otra instancia en 9001 y agregar [1].uri=http://localhost:9001
spring.cloud.discovery.client.simple.instances.courts-service[0].uri=http://localhost:8001

# Timeouts de las llamadas Feign a otros microservicios (ms)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

config.time-zone=America/Bogota
# Politica de cancelacion: el cliente puede cancelar hasta X horas antes del inicio
config.cancellation.min-hours=24
# Cada cuanto se marcan como expiradas las reservas con hold vencido (ms)
config.hold.expiration-interval=60000
