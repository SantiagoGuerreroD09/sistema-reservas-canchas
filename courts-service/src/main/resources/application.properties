spring.application.name=courts-service
server.port=8001

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_courts}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Instancias de reservations-service (se reemplaza por Eureka mas adelante) se tiene que agregar la dependencia de loadbalancer
# spring.cloud.discovery.client.simple.instances.reservations-service[0].uri=http://localhost:8002

# Timeouts de las llamadas Feign a otros microservicios (ms)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

config.time-zone=America/Bogota
# Minutos que dura el bloqueo temporal (hold) de un horario mientras se paga
config.hold.minutes=15
# Cada cuanto se liberan los holds vencidos (ms)
config.hold.release-interval=60000
